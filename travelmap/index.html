  <style>
    /* Self-contained inline SVG world map. Generated from world-atlas-countries.geojson
       (equirectangular projection). No tiles, no libraries, no external requests. */
    .travel-map {
      display: block;
      width: 100%;
      height: auto;
      background: #e9edf0;
      border: 1px solid var(--table-border);
      border-radius: 8px;
    }
    .travel-map .country {
      fill: #c7d0d7;
      stroke: #e9edf0;
      stroke-width: 0.4;
      vector-effect: non-scaling-stroke;
    }
    .travel-map .dot { stroke: none; }
    .travel-map .country.visited { fill: var(--accent); }
    .travel-map .dot.visited { fill: var(--accent); }
    .travel-map .country:hover { fill: var(--link-color); }
    @media (prefers-color-scheme: dark) {
      .travel-map { background: #12161a; }
      .travel-map .country { fill: #39424b; stroke: #12161a; }
    }
    .map-legend {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-size: 0.9rem;
      color: var(--text-color);
      margin-top: 0.75rem;
    }
    .map-legend .swatch {
      display: inline-block;
      width: 1rem;
      height: 1rem;
      border-radius: 2px;
      background: var(--accent);
    }
  </style>
