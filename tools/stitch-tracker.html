<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Stitch Tracker</title>
  <link rel="stylesheet" href="../style.css">
  <style>
    .tracker-container {
      display: flex;
      flex-direction: column;
      gap: 2rem;
      margin-top: 2rem;
      text-align: center;
    }
    .counter-section {
      border: 1px solid #ccc;
      padding: 1.5rem;
      border-radius: 8px;
    }
    .counter-section h2 {
      margin-top: 0;
    }
    .counter-value {
      font-size: 4rem;
      font-weight: bold;
      margin: 1rem 0;
    }
    .button-group {
      display: flex;
      justify-content: center;
      gap: 1rem;
    }
    button {
      padding: 1rem 2rem;
      font-size: 2rem;
      cursor: pointer;
      border-radius: 8px;
      border: 1px solid #999;
      background-color: #f0f0f0;
      touch-action: manipulation;
    }
    button:active {
      background-color: #e0e0e0;
    }
    .reset-button {
      margin-top: 3rem;
      padding: 1rem;
      font-size: 1.2rem;
      background-color: #ffe0e0;
      border-color: #ff9999;
    }
  </style>
</head>
<body>
  <header>
    <nav>
      <ul>
        <li><a href="../index.html">Home</a></li>
        <li><a href="../travelmap/">Travel Map</a></li>
      </ul>
    </nav>
  </header>

  <main>
    <article>
      <h1>Stitch Tracker</h1>
      <p>A simple, offline tool to track your knitting progress.</p>
      
      <div class="tracker-container">
        <div class="counter-section">
          <h2>Rows</h2>
          <div class="counter-value" id="row-count">0</div>
          <div class="button-group">
            <button onclick="updateCount('row', -1)">-</button>
            <button onclick="updateCount('row', 1)">+</button>
          </div>
        </div>

        <div class="counter-section">
          <h2>Stitches</h2>
          <div class="counter-value" id="stitch-count">0</div>
          <div class="button-group">
            <button onclick="updateCount('stitch', -1)">-</button>
            <button onclick="updateCount('stitch', 1)">+</button>
          </div>
        </div>
      </div>

      <button class="reset-button" onclick="resetProject()">Reset Project</button>
    </article>
  </main>

  <footer>
    <hr>
    <p>This website's source code is open and available on <a href="https://github.com/mds08011/kimberlytravel">Github</a>.</p>
  </footer>

  <script>
    let counts = {
      row: parseInt(localStorage.getItem('stitchTracker_rowCount') || '0'),
      stitch: parseInt(localStorage.getItem('stitchTracker_stitchCount') || '0')
    };

    document.getElementById('row-count').textContent = counts.row;
    document.getElementById('stitch-count').textContent = counts.stitch;

    function updateCount(type, amount) {
      counts[type] += amount;
      if (counts[type] < 0) counts[type] = 0;
      
      document.getElementById(`${type}-count`).textContent = counts[type];
      localStorage.setItem(`stitchTracker_${type}Count`, counts[type]);
    }

    function resetProject() {
      if (confirm("Are you sure you want to reset your project? This will erase your row and stitch counts.")) {
        counts.row = 0;
        counts.stitch = 0;
        
        document.getElementById('row-count').textContent = counts.row;
        document.getElementById('stitch-count').textContent = counts.stitch;
        
        localStorage.setItem('stitchTracker_rowCount', '0');
        localStorage.setItem('stitchTracker_stitchCount', '0');
      }
    }
  </script>
</body>
</html>
